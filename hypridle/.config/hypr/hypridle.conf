general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple lockscreen instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = "${XDG_CONFIG_HOME}"/hypr/scripts/resume.sh  # to avoid having to press a key twice to turn on the display.
}

listener {
    timeout = 150                                # 2.5min.
    on-timeout = "command -v brightnessctl >/dev/null 2>&1 && brightnessctl -s set 10 || true"  # set monitor backlight to minimum
    on-resume = "command -v brightnessctl >/dev/null 2>&1 && brightnessctl -r || true"           # monitor backlight restore
}

# Keyboard backlight — only runs if brightnessctl and a kbd_backlight device exist
listener { 
    timeout = 150                                          # 2.5min.
    on-timeout = "command -v brightnessctl >/dev/null 2>&1 && brightnessctl -sd rgb:kbd_backlight set 0 || true"
    on-resume = "command -v brightnessctl >/dev/null 2>&1 && brightnessctl -rd rgb:kbd_backlight || true"
}

listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

