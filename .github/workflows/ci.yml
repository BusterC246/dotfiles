name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stow and shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y stow shellcheck

      - name: ShellCheck all shell scripts
        run: |
          shellcheck \
            -e SC1091 \
            sync.sh \
            uninstall.sh \
            hyprland/.config/hypr/scripts/wallpaper.sh \
            hyprland/.config/hypr/scripts/xdg-portal.sh \
            hypridle/.config/hypr/scripts/resume.sh \
            hypridle/.config/hypr/scripts/suspend.sh \
            shell/.config/shell/env.sh \
            shell/.config/shell/interactive.sh \
            bash/.bashrc \
            bash/.bash_login \
            .githooks/pre-commit \
            .githooks/post-commit \
            .githooks/pre-push \
            .githooks/post-push

      - name: Stow dry-run
        run: |
          TEST_HOME=$(mktemp -d)
          export HOME="$TEST_HOME"
          mkdir -p "$TEST_HOME/.config"
          ./sync.sh --simulate
          rm -rf "$TEST_HOME"
